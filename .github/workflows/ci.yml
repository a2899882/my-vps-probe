name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l agent/*.go agent/tcpping/*.go common/*.go common/tcpping/*.go server/*.go tcpping/*.go)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Shell syntax
        run: bash -n install-master.sh install.sh scripts/tz.sh uninstall-agent.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - name: Frontend template and interaction checks
        run: npm ci --prefix tests/frontend --ignore-scripts --no-audit --no-fund && npm test --prefix tests/frontend
      - name: Build release targets
        run: |
          go build -trimpath -o /tmp/probe-server ./server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/probe-agent-amd64 ./agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/probe-agent-arm64 ./agent
      - name: Server and synthetic agent integration
        run: node tests/integration/smoke.cjs /tmp/probe-server
